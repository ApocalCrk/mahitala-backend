stages:
  - deploy

deploy_to_server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "$REMOTE_HOST $REMOTE_PORT" > ~/.ssh/config
    - ssh-keyscan -p $REMOTE_PORT $REMOTE_HOST >> ~/.ssh/known_hosts
  script:
    - rsync -avz -e "ssh -p $REMOTE_PORT" ./ $SSH_USER@$REMOTE_HOST:/home/$SSH_USER/mahitala-backend

    - ssh -p $REMOTE_PORT $SSH_USER@$REMOTE_HOST <<EOF
        cd /home/$SSH_USER/mahitala-backend
        docker stop mahitala-backend || true
        docker rm mahitala-backend || true
        docker build -t mahitala-backend:latest .
        docker run -d --name mahitala-backend -p 3321:3321 mahitala-backend:latest
      EOF
  only:
    - main
