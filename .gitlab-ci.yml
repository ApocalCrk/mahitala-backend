workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_REF_NAME == "development"'

stages:
  - build
  - deploy

build-job:
  stage: build
  script:
    - echo "Compiling code..."
    - sleep 5

deploy-job:
  stage: deploy
  script:
    - echo "Deploying application..."
