stages:
  - deploy

deploy_to_server:
  stage: deploy
  image: alpine:latest
  before_script:
  - apk add --no-cache openssh rsync
  - mkdir -p ~/.ssh
  - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  - |
    cat <<EOF > ~/.ssh/config
    Host ngrok-server
      HostName $REMOTE_HOST
      Port $REMOTE_PORT
      User $SSH_USER
      IdentityFile ~/.ssh/id_rsa
      StrictHostKeyChecking no
    EOF
  - ssh-keyscan -p $REMOTE_PORT $REMOTE_HOST >> ~/.ssh/known_hosts
  script:
    - rsync -avz -e "ssh ngrok-server" ./ ngrok-server:/home/$SSH_USER/projects/gitlab/mahitala-backend
    - ssh ngrok-server <<EOF
        cd /home/$SSH_USER/projects/gitlab/mahitala-backend
        docker stop mahitala-backend || true
        docker rm mahitala-backend || true
        docker build -t mahitala-backend:latest .
        docker run -d --name mahitala-backend -p 3000:3000 mahitala-backend:latest
      EOF
  only:
    - production
    