stages:
  - deploy

deploy:
  image: alpine:latest
  stage: deploy
  before_script:
    # Install SSH dan rsync
    - apk add --no-cache openssh-client rsync

    # Setup folder ssh
    - mkdir -p ~/.ssh

    # Simpan private key dari variable ke file dan atur permission
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # Buat config SSH dengan host alias 'remote-server'
    - |
      echo -e "Host remote-server
        HostName $REMOTE_HOST
        Port $REMOTE_PORT
        User $REMOTE_USER
        IdentityFile ~/.ssh/id_rsa
        StrictHostKeyChecking no
      " > ~/.ssh/config

    # Tambahkan host key ke known_hosts untuk menghindari prompt manual
    - ssh-keyscan -p $REMOTE_PORT $REMOTE_HOST >> ~/.ssh/known_hosts

  script:
    # Pull image, stop container lama, remove container lama, dan jalankan container baru
    - ssh remote-server "
        docker pull $DOCKER_IMAGE &&
        docker stop mahitala-backend || true &&
        docker rm mahitala-backend || true &&
        docker run -d --name mahitala-backend -p 3000:3000 $DOCKER_IMAGE
      "

  only:
    - production
